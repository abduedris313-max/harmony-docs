<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF to Markdown AI Pro</title>

    <!-- PWA Web Manifest & Metadata -->
    <link id="manifest-link" rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Convert PDF documents to GitHub Flavored Markdown with AI structure recognition, split-view editor, and export options." />
    <link rel="apple-touch-icon" href="pwa-192.png" />
    <link rel="icon" type="image/png" href="pwa-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          var swUrl = new URL('sw.js', window.location.href).href;
          navigator.serviceWorker.register(swUrl)
            .then((reg) => console.log('ServiceWorker registered:', reg.scope))
            .catch((err) => console.warn('ServiceWorker registration warning:', err));
        });
      }
    </script>
  </body>
</html>
